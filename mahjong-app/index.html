<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🀄 你的专属麻将日记</title>
<style>
  :root {
    --bg: #faf8f5;
    --card: #fff;
    --win: #e74c3c;
    --lose: #555;
    --win-bg: #fff5f5;
    --lose-bg: #f8f8f8;
    --gold: #d4940b;
    --text: #333;
    --text-light: #999;
    --border: #eee;
    --shadow: 0 2px 16px rgba(0,0,0,0.06);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 40px;
  }
  .container { max-width: 460px; margin: 0 auto; padding: 0 16px; }

  /* Header */
  header {
    background: linear-gradient(135deg, #c0392b, #e74c3c, #f06292);
    color: #fff;
    padding: 28px 16px 22px;
    text-align: center;
    position: sticky; top: 0; z-index: 10;
    box-shadow: 0 2px 12px rgba(192,57,43,0.25);
  }
  header h1 { font-size: 1.5em; letter-spacing: 1px; }
  header .heart { font-size: 1.3em; animation: pulse 1.5s infinite; display: inline-block; }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.15)} }
  header .motto { font-size: 0.8em; opacity: 0.85; margin-top: 4px; }

  /* Emotion Banner */
  .emotion-banner {
    margin: 16px 0; padding: 18px 20px; border-radius: 14px;
    text-align: center; box-shadow: var(--shadow);
    transition: all 0.4s;
  }
  .emotion-banner.win {
    background: linear-gradient(135deg, #fff5f5, #ffe8e8);
    border: 1.5px solid #fcc;
  }
  .emotion-banner.lose {
    background: linear-gradient(135deg, #f5f5f5, #e8e8e8);
    border: 1.5px solid #eee;
  }
  .emotion-banner.neutral {
    background: linear-gradient(135deg, #fffdf5, #fff9e0);
    border: 1.5px solid #ffeeba;
  }
  .emotion-banner .emoji { font-size: 2.8em; margin-bottom: 6px; }
  .emotion-banner .msg { font-size: 1.05em; font-weight: 600; line-height: 1.6; color: #444; }
  .emotion-banner .sub-msg { font-size: 0.8em; color: var(--text-light); margin-top: 4px; }

  /* Quick Stats Bar */
  .quick-stats {
    display: flex; gap: 10px; margin-bottom: 16px;
  }
  .quick-stat {
    flex: 1; background: var(--card); border-radius: 12px;
    padding: 14px 10px; text-align: center; box-shadow: var(--shadow);
  }
  .quick-stat .num {
    font-size: 1.6em; font-weight: 700;
  }
  .quick-stat .num.win-color { color: var(--win); }
  .quick-stat .num.lose-color { color: var(--lose); }
  .quick-stat .label { font-size: 0.75em; color: var(--text-light); margin-top: 2px; }

  /* Tabs */
  .tabs {
    display: flex; gap: 0; margin-bottom: 14px;
    background: var(--card); border-radius: 12px;
    overflow: hidden; box-shadow: var(--shadow);
  }
  .tab {
    flex: 1; padding: 13px 8px; text-align: center; cursor: pointer;
    border: none; background: none; font-size: 0.9em; font-weight: 600;
    color: var(--text-light); transition: all 0.2s;
  }
  .tab.active { color: var(--win); background: #fff5f5; border-bottom: 3px solid var(--win); }
  .tab:hover { background: #fffafa; }

  /* Cards */
  .card {
    background: var(--card); border-radius: 14px; padding: 20px;
    margin-bottom: 14px; box-shadow: var(--shadow);
  }
  .card h2 { font-size: 1.05em; margin-bottom: 16px; color: #555; display: flex; align-items: center; gap: 8px; }

  /* Form */
  .big-toggle {
    display: flex; gap: 12px; margin-bottom: 18px;
  }
  .big-toggle button {
    flex: 1; padding: 28px 16px; border: 2.5px solid var(--border);
    border-radius: 14px; background: #fff; cursor: pointer;
    font-size: 1.1em; font-weight: 700; transition: all 0.25s;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
  }
  .big-toggle button .icon { font-size: 2em; }
  .big-toggle .btn-win.selected {
    border-color: #e74c3c; background: #fff5f5; color: #e74c3c;
    box-shadow: 0 0 0 4px rgba(231,76,60,0.1);
  }
  .big-toggle .btn-lose.selected {
    border-color: #555; background: #f5f5f5; color: #333;
    box-shadow: 0 0 0 4px rgba(0,0,0,0.05);
  }

  .form-row { margin-bottom: 14px; }
  .form-row label { display: block; font-size: 0.85em; font-weight: 600; color: #777; margin-bottom: 6px; }
  .form-row input, .form-row textarea {
    width: 100%; padding: 12px 14px; border: 1.5px solid var(--border);
    border-radius: 10px; font-size: 0.95em; background: #fafaf9;
    transition: border 0.2s; font-family: inherit;
  }
  .form-row input:focus, .form-row textarea:focus { outline: none; border-color: #e74c3c; }
  .form-row textarea { resize: vertical; min-height: 60px; }

  .btn {
    padding: 13px 20px; border: none; border-radius: 10px; font-size: 1em;
    font-weight: 700; cursor: pointer; transition: all 0.2s; width: 100%;
  }
  .btn-save { background: linear-gradient(135deg, #e74c3c, #c0392b); color: #fff; }
  .btn-save:hover { opacity: 0.9; transform: translateY(-1px); }
  .btn-remind { background: var(--gold); color: #fff; }
  .btn-remind:hover { opacity: 0.9; }

  .btn-sm { padding: 7px 14px; font-size: 0.78em; border-radius: 8px; width: auto; }
  .btn-ghost { background: none; color: #999; border: 1px solid #ddd; }
  .btn-ghost:hover { background: #f5f5f5; }
  .btn-del { background: none; color: #e74c3c; }
  .btn-del:hover { background: #fff5f5; }

  /* Records */
  .record-item {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 0; border-bottom: 1px solid var(--border);
  }
  .record-item:last-child { border-bottom: none; }
  .record-icon {
    width: 44px; height: 44px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.5em; flex-shrink: 0;
  }
  .record-icon.win { background: #fff0f0; }
  .record-icon.lose { background: #f0f0f0; }
  .record-info { flex: 1; min-width: 0; }
  .record-info .result { font-weight: 700; font-size: 0.95em; }
  .record-info .result.win-text { color: var(--win); }
  .record-info .result.lose-text { color: var(--lose); }
  .record-info .date { font-size: 0.75em; color: var(--text-light); }
  .record-info .note { font-size: 0.82em; color: #777; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .record-amount { font-weight: 700; font-size: 1em; text-align: right; }
  .record-amount.win-text { color: var(--win); }
  .record-amount.lose-text { color: var(--lose); }
  .record-emotion { font-size: 0.75em; color: var(--text-light); text-align: right; margin-top: 2px; max-width: 120px; }

  /* Stats */
  .stat-row { display: flex; gap: 10px; margin-bottom: 10px; }
  .stat-box {
    flex: 1; text-align: center; padding: 16px 8px;
    background: #fafaf9; border-radius: 10px;
  }
  .stat-box .num { font-size: 1.6em; font-weight: 700; }
  .stat-box .num.red { color: var(--win); }
  .stat-box .num.gray { color: #555; }
  .stat-box .num.gold { color: var(--gold); }
  .stat-box .label { font-size: 0.75em; color: var(--text-light); margin-top: 2px; }

  .streak-bar {
    display: flex; gap: 4px; margin-top: 12px; justify-content: center;
  }
  .streak-dot {
    width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.85em; font-weight: 700; color: #fff;
  }
  .streak-dot.win-dot { background: #e74c3c; }
  .streak-dot.lose-dot { background: #999; }

  /* Reminder */
  .reminder-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 0; border-bottom: 1px solid var(--border);
  }
  .reminder-item:last-child { border-bottom: none; }
  .reminder-item .r-time { font-weight: 700; font-size: 1em; color: #555; }
  .reminder-item .r-detail { font-size: 0.8em; color: var(--text-light); }
  .reminder-item .r-badge {
    font-size: 0.72em; padding: 4px 10px; border-radius: 10px; font-weight: 600;
  }
  .badge-upcoming { background: #fff3cd; color: #856404; }
  .badge-past { background: #f1f1f1; color: #aaa; }

  .section { display: none; }
  .section.active { display: block; }

  .empty { text-align: center; color: #ccc; padding: 36px; font-size: 0.9em; }
  .empty .big-emoji { font-size: 3em; margin-bottom: 8px; }

  /* Summary */
  .summary-stats {
    display: flex; gap: 10px; margin-bottom: 14px;
  }
  .summary-stat {
    flex: 1; text-align: center; padding: 12px 6px;
    background: #fafaf9; border-radius: 10px;
  }
  .summary-stat .num { font-size: 1.3em; font-weight: 700; }
  .summary-stat .num.w { color: var(--win); }
  .summary-stat .num.l { color: var(--lose); }
  .summary-stat .num.n { color: var(--gold); }
  .summary-stat .label { font-size: 0.72em; color: var(--text-light); margin-top: 2px; }
  .summary-emotion {
    padding: 14px; border-radius: 10px; font-size: 0.88em;
    line-height: 1.7; color: #555;
  }
  .summary-emotion.positive { background: #fff8f6; border: 1px solid #fdd; }
  .summary-emotion.negative { background: #f8f8f8; border: 1px solid #eee; }
  .summary-emotion.mixed { background: #fffdf5; border: 1px solid #ffeeba; }
  .summary-emotion .se-emoji { font-size: 1.6em; margin-bottom: 6px; }

  /* Mood picker */
  .mood-pick { display: flex; gap: 8px; }
  .mood-btn {
    flex: 1; padding: 10px 4px; border: 2px solid var(--border);
    border-radius: 10px; background: #fff; cursor: pointer;
    font-size: 1.3em; display: flex; flex-direction: column;
    align-items: center; gap: 2px; transition: all 0.2s;
  }
  .mood-btn span { font-size: 0.55em; color: #999; font-weight: 500; }
  .mood-btn.selected { border-color: var(--win); background: #fff5f5; transform: scale(1.05); }
  .mood-btn:hover { background: #fdf8f8; }

  /* Milestone overlay */
  .milestone-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.7); z-index: 1000;
    display: flex; align-items: center; justify-content: center;
    animation: fadeIn 0.3s;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .milestone-card {
    background: #fff; border-radius: 20px; padding: 30px 24px;
    text-align: center; max-width: 340px; width: 90%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  @keyframes popIn { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .milestone-card .ms-emoji { font-size: 4em; margin-bottom: 10px; animation: bounce 0.6s infinite alternate; }
  @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-10px); } }
  .milestone-card .ms-title { font-size: 1.4em; font-weight: 800; color: var(--win); margin-bottom: 8px; }
  .milestone-card .ms-detail { font-size: 0.95em; color: #555; line-height: 1.6; margin-bottom: 18px; }
  .milestone-card .ms-btn {
    padding: 12px 40px; border: none; border-radius: 25px;
    background: linear-gradient(135deg, #e74c3c, #f06292);
    color: #fff; font-size: 1em; font-weight: 700; cursor: pointer;
  }

  /* Simple chart */
  .chart-container { margin: 16px 0; }
  .bar-chart { display: flex; align-items: flex-end; gap: 3px; height: 100px; padding: 0 4px; }
  .bar-chart .bar {
    flex: 1; border-radius: 3px 3px 0 0; min-width: 6px;
    transition: height 0.3s; cursor: pointer; position: relative;
  }
  .bar-chart .bar.win-bar { background: linear-gradient(180deg, #e74c3c, #f06292); }
  .bar-chart .bar.lose-bar { background: linear-gradient(180deg, #999, #bbb); }
  .bar-chart .bar:hover { opacity: 0.75; }
  .chart-labels { display: flex; gap: 3px; padding: 4px 4px; font-size: 0.6em; color: #aaa; }
  .chart-labels span { flex: 1; text-align: center; min-width: 6px; }

  /* Diary-style records */
  .diary-record {
    padding: 16px; margin-bottom: 10px; border-radius: 12px;
    position: relative;
  }
  .diary-record.win-bg { background: linear-gradient(135deg, #fff8f6, #fff0f0); border-left: 4px solid #e74c3c; }
  .diary-record.lose-bg { background: linear-gradient(135deg, #f9f9f9, #f2f2f2); border-left: 4px solid #999; }
  .diary-record .d-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
  .diary-record .d-mood { font-size: 1.8em; }
  .diary-record .d-amount { font-weight: 800; font-size: 1.1em; text-align: right; }
  .diary-record .d-amount.win-text { color: var(--win); }
  .diary-record .d-amount.lose-text { color: var(--lose); }
  .diary-record .d-date { font-size: 0.75em; color: var(--text-light); }
  .diary-record .d-story { font-size: 0.88em; color: #555; line-height: 1.6; margin-top: 6px; }
  .diary-record .d-note { font-size: 0.82em; color: #888; margin-top: 4px; font-style: italic; }
  .diary-record .d-badge {
    display: inline-block; font-size: 0.68em; padding: 3px 8px;
    border-radius: 10px; font-weight: 600; margin-top: 6px;
  }
  .badge-milestone { background: #ffe0e0; color: #c0392b; }

  /* Toast */
  .toast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    background: #333; color: #fff; padding: 10px 24px; border-radius: 20px;
    font-size: 0.9em; z-index: 999; opacity: 0; transition: opacity 0.3s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <div class="heart">❤️</div>
  <h1>🀄 你的专属麻将日记</h1>
  <div class="motto">每一局都值得被记住，每一种心情都值得被温柔对待 ✨</div>
</header>

<div class="container">
  <!-- Emotion Banner -->
  <div class="emotion-banner neutral" id="emotionBanner">
    <div class="emoji" id="emotionEmoji">🀄</div>
    <div class="msg" id="emotionMsg">还没有记录，今天打牌了吗？</div>
    <div class="sub-msg" id="emotionSub"></div>
  </div>

  <!-- Quick Stats -->
  <div class="quick-stats">
    <div class="quick-stat">
      <div class="num" style="color:#e74c3c;" id="statWins">0</div>
      <div class="label">🏆 赢</div>
    </div>
    <div class="quick-stat">
      <div class="num" style="color:#555;" id="statLosses">0</div>
      <div class="label">😤 输</div>
    </div>
    <div class="quick-stat">
      <div class="num" style="color:#d4940b;" id="statRate">-</div>
      <div class="label">📊 胜率</div>
    </div>
    <div class="quick-stat">
      <div class="num" id="statNet" style="color:#333;">0</div>
      <div class="label">💰 净盈亏</div>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" onclick="switchTab('record')">📝 记一局</button>
    <button class="tab" onclick="switchTab('history')">📋 历史</button>
    <button class="tab" onclick="switchTab('reminder')">⏰ 约局</button>
    <button class="tab" onclick="switchTab('summary')">📊 总结</button>
  </div>

  <!-- Record Tab -->
  <div class="section active" id="sec-record">
    <div class="card">
      <h2>📝 刚才打得怎么样？</h2>

      <div class="big-toggle" id="winLoseToggle">
        <button class="btn-win" onclick="setResult('win', this)">
          <span class="icon">🎉</span>赢了！
        </button>
        <button class="btn-lose" onclick="setResult('lose', this)">
          <span class="icon">😤</span>输了
        </button>
      </div>

      <div class="form-row">
        <label>💰 金额（赢了多少 / 输了多少）</label>
        <input type="number" id="recAmount" placeholder="比如 200" min="0" step="1">
      </div>
      <div style="margin-bottom:14px;">
        <label style="display:block;font-size:0.85em;font-weight:600;color:#777;margin-bottom:8px;">😊 打完心情怎么样？</label>
        <div class="mood-pick" id="moodPick">
          <button class="mood-btn" onclick="pickMood('😆', this)">😆<span>超开心</span></button>
          <button class="mood-btn selected" onclick="pickMood('😊', this)">😊<span>还不错</span></button>
          <button class="mood-btn" onclick="pickMood('😐', this)">😐<span>还行</span></button>
          <button class="mood-btn" onclick="pickMood('😤', this)">😤<span>有点不爽</span></button>
          <button class="mood-btn" onclick="pickMood('😭', this)">😭<span>很难过</span></button>
        </div>
      </div>
      <div class="form-row">
        <label>📅 日期</label>
        <input type="date" id="recDate">
      </div>
      <div class="form-row">
        <label>💬 想说的话（可选）</label>
        <textarea id="recNote" placeholder="比如：今天手气超好！或者：被对家杠上开花..."></textarea>
      </div>
      <button class="btn btn-save" onclick="saveRecord()">💾 记下来</button>
    </div>
  </div>

  <!-- History Tab -->
  <div class="section" id="sec-history">
    <div class="card">
      <h2>📋 对局记录</h2>
      <div id="records"></div>
    </div>
    <!-- Streak -->
    <div class="card" id="streakCard" style="text-align:center;">
      <h2>📈 近期走势</h2>
      <div class="streak-bar" id="streakBar"></div>
    </div>
  </div>

  <!-- Reminder Tab -->
  <div class="section" id="sec-reminder">
    <div class="card">
      <h2>⏰ 提醒她约局</h2>
      <div class="form-row">
        <label>📅 日期</label>
        <input type="date" id="remDate">
      </div>
      <div class="form-row">
        <label>🕐 时间</label>
        <input type="time" id="remTime" value="19:00">
      </div>
      <div class="form-row">
        <label>📍 地点 / 备注（可选）</label>
        <input id="remNote" placeholder="比如：老地方三楼">
      </div>
      <button class="btn btn-remind" onclick="addReminder()">🔔 添加提醒</button>
    </div>
    <div class="card">
      <h2>📋 提醒列表</h2>
      <div id="reminders"></div>
    </div>
  </div>

  <!-- Summary Tab -->
  <div class="section" id="sec-summary">
    <div class="card" id="trendCard">
      <h2>📈 近期走势</h2>
      <div id="trendChart"></div>
    </div>
    <div class="card" id="weekSummary">
      <h2>📅 本周总结</h2>
      <div id="weekContent"></div>
    </div>
    <div class="card" id="monthSummary">
      <h2>📆 本月总结</h2>
      <div id="monthContent"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="milestone-overlay" id="milestoneOverlay" style="display:none;">
  <div class="milestone-card">
    <div class="ms-emoji" id="msEmoji"></div>
    <div class="ms-title" id="msTitle"></div>
    <div class="ms-detail" id="msDetail"></div>
    <button class="ms-btn" onclick="closeMilestone()">❤️ 知道了！</button>
  </div>
</div>

<script>
// ==================== DATA ====================
const STORAGE_KEY = 'mj_her_records';
const REM_KEY = 'mj_her_reminders';

function getRecords() { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
function saveRecords(data) { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
function getReminders() { return JSON.parse(localStorage.getItem(REM_KEY) || '[]'); }
function saveReminders(data) { localStorage.setItem(REM_KEY, JSON.stringify(data)); }

// ==================== EMOTION ENGINE ====================
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function computeEmotion() {
  const records = getRecords();
  if (records.length === 0) {
    return {
      emoji: '🀄',
      msg: '这里还没有记录呢～今天搓麻将了吗？',
      sub: '不管输赢，我都会在这里认真记下每一局。第一次记录，就从今天开始吧～把她的名字写在上面，然后骄傲地点下"赢了"或温柔地点下"输了" ❤️',
      mood: 'neutral'
    };
  }

  const last = records[0];
  const wins = records.filter(r => r.result === 'win');
  const losses = records.filter(r => r.result === 'lose');
  const total = records.length;
  const winRate = wins.length / total;
  const totalNet = records.reduce((s, r) => s + (r.result === 'win' ? r.amount : -r.amount), 0);

  // Current streak
  let currentStreak = 0;
  for (const r of records) {
    if (r.result === last.result) currentStreak++;
    else break;
  }

function updateEmotionBanner() {
  const e = computeEmotion();
  const banner = document.getElementById('emotionBanner');
  banner.className = 'emotion-banner ' + e.mood;
  document.getElementById('emotionEmoji').textContent = e.emoji;
  document.getElementById('emotionMsg').textContent = e.msg;
  document.getElementById('emotionSub').textContent = e.sub;
}

// ==================== QUICK STATS ====================
function updateQuickStats() {
  const records = getRecords();
  const wins = records.filter(r => r.result === 'win').length;
  const losses = records.filter(r => r.result === 'lose').length;
  const total = records.length;
  const net = records.reduce((s, r) => s + (r.result === 'win' ? r.amount : -r.amount), 0);
  const rate = total > 0 ? ((wins / total) * 100).toFixed(0) + '%' : '-';

  document.getElementById('statWins').textContent = wins;
  document.getElementById('statLosses').textContent = losses;
  document.getElementById('statRate').textContent = rate;
  const netEl = document.getElementById('statNet');
  netEl.textContent = net >= 0 ? '+' + net : net;
  netEl.style.color = net > 0 ? '#e74c3c' : net < 0 ? '#555' : '#333';
}

// ==================== TAB SWITCHING ====================
function switchTab(name) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('sec-' + name).classList.add('active');
  event.target.classList.add('active');
  if (name === 'history') { renderHistory(); renderStreak(); }
  if (name === 'reminder') renderReminders();
  if (name === 'summary') renderSummaries();
}

// ==================== TOAST ====================
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

let currentResult = null;
let currentMood = '😊';

function setResult(result, btn) {
  currentResult = result;
  document.querySelectorAll('#winLoseToggle button').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
}

function pickMood(mood, btn) {
  currentMood = mood;

  btn.classList.add('selected');

function saveRecord() {
  if (!currentResult) { toast('😊 先告诉我——今天赢了吗？'); return; }
  const amount = parseInt(document.getElementById('recAmount').value) || 0;
  if (amount <= 0) { toast('💰 填一下金额吧，多少都值得记下来～'); return; }
  const date = document.getElementById('recDate').value || new Date().toISOString().split('T')[0];
  const note = document.getElementById('recNote').value.trim();

  const records = getRecords();
  const oldTotal = records.length;
  const oldWins = records.filter(r => r.result === 'win').length;

  records.unshift({
    id: Date.now(),
    result: currentResult,
    amount,
    date,
    note,
    mood: currentMood
  });
  saveRecords(records);

  // Clear form
  currentResult = null;
  currentMood = '😊';
  document.querySelectorAll('#winLoseToggle button').forEach(b => b.classList.remove('selected'));
  document.querySelectorAll('#moodPick .mood-btn').forEach(b => b.classList.remove('selected'));
  document.querySelector('#moodPick .mood-btn:nth-child(2)').classList.add('selected');
  document.getElementById('recAmount').value = '';
  document.getElementById('recNote').value = '';

  updateEmotionBanner();
  updateQuickStats();

  // --- Milestone check ---
  const newTotal = records.length;
  const newWins = records.filter(r => r.result === 'win').length;
  const milestone = checkMilestone(oldTotal, newTotal, oldWins, newWins, records, currentResult, amount);

  if (milestone) {
    showMilestone(milestone);
    toast('🏆 里程碑解锁！');

  if (streak === 5 && lastResult === 'win') return { emoji: '⚡', title: '五连胜！！', detail: '连续五场，你都是最后的赢家。对手们现在提起你的名字应该要抖三抖了。五连胜不是巧合，是实力+心态+运气的完美共振。趁热打铁，看看你能走多远！' };

  // Net total milestones
  const netMilestones = { 1000: '💰', 5000: '🤑', 10000: '💎' };
  for (const [threshold, emoji] of Object.entries(netMilestones)) {
    const t = parseInt(threshold);
    const prevNet = net - (lastResult === 'win' ? lastAmount : -lastAmount);
    if (net >= t && prevNet < t) {
      return {
        emoji,
        title: `总盈亏突破 +${t}！`,

    }
  }

  return null;
}

function deleteRecord(id) {
  let records = getRecords();
  records = records.filter(r => r.id !== id);
  saveRecords(records);
  renderHistory();
  renderStreak();
  updateEmotionBanner();
  updateQuickStats();

  }
}

function renderHistory() {
  const records = getRecords();
  const container = document.getElementById('records');
  if (records.length === 0) {
    container.innerHTML = '<div class="empty"><div class="big-emoji">🀄</div>还没有记录呢～每一局都是一篇日记的开始 📖</div>';
    return;
  }

  // Find milestone indices
  const milestones = new Set();
  let winCount = 0;
  const seenStreaks = {};
  for (let i = records.length - 1; i >= 0; i--) {
    const r = records[i];
    if (r.result === 'win') winCount++;
    // Milestone: 1st, 10th, 50th, 100th game
    if (records.length - i === 1 || records.length - i === 10 || records.length - i === 50 || records.length - i === 100) {
      milestones.add(i);
    }
    // Milestone: 1st, 5th, 10th, 20th, 50th win
    if ((winCount === 1 || winCount === 5 || winCount === 10 || winCount === 20 || winCount === 50) && r.result === 'win') {
      milestones.add(i);
    }
  }

  container.innerHTML = records.map((r, idx) => {
    const isWin = r.result === 'win';
    const bgClass = isWin ? 'win-bg' : 'lose-bg';
    const amountStr = (isWin ? '+' : '-') + r.amount;
    const resultClass = isWin ? 'win-text' : 'lose-text';
    const mood = r.mood || (isWin ? '😊' : '😐');
    const dateStr = new Date(r.date + 'T00:00:00').toLocaleDateString('zh-CN', {
      month: 'short', day: 'numeric', weekday: 'short'
    });
    const isMilestone = milestones.has(idx);

    // Get streak for this record
    let streakForward = 1;
    for (let i = idx - 1; i >= 0; i--) {
      if (records[i].result === r.result) streakForward++;
      else break;
    }
    const totalStreak = streakForward;

    const story = generateDiaryStory(r, idx, records, totalStreak, isMilestone);
    const emotionShort = getRecordEmotion(r, idx, records);

    return `
      <div class="diary-record ${bgClass}">
        <div class="d-header">
          <div class="d-mood">${mood}</div>
          <div>
            <div class="d-amount ${resultClass}">${amountStr}</div>
            <div class="d-date">${dateStr}</div>
          </div>
        </div>
        <div class="d-story">${story}</div>
        ${r.note ? `<div class="d-note">"${r.note}"</div>` : ''}
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <span class="d-badge ${isMilestone ? 'badge-milestone' : ''}" style="background:${isWin?'#ffe0e0':'#f0f0f0'};color:${isWin?'#c0392b':'#888'};">
            ${isMilestone ? '🏅 ' : ''}${emotionShort}
          </span>
          <button class="btn btn-ghost btn-sm" onclick="deleteRecord(${r.id})">删除</button>
        </div>
      </div>`;
  }).join('');
}

function getRecordEmotion(record, idx, allRecords) {
  const total = allRecords.length;
  let streakForward = 1, streakBackward = 0;
  for (let i = idx - 1; i >= 0; i--) {
    if (allRecords[i].result === record.result) streakForward++;
    else break;
  }
  for (let i = idx + 1; i < allRecords.length; i++) {
    if (allRecords[i].result === record.result) streakBackward++;
    else break;
  }
  const totalStreak = streakForward + streakBackward;

  if (record.result === 'win') {
    if (record.amount >= 800) return pick(['💰 赢麻了', '🤑 暴击', '💎 天降横财', '🎰 头奖']);
    if (record.amount >= 400) return pick(['💎 大获全胜', '🏆 含金量拉满', '🎯 重磅胜利', '✨ 大丰收']);
    if (totalStreak >= 5) return pick(['🔥 ' + totalStreak + '连胜巅峰', '👑 王者之路', '⚡ 无人能挡']);
    if (totalStreak >= 3) return pick(['🔥 ' + totalStreak + '连胜', '📈 势不可挡', '⚡ 状态火热']);
    if (idx === total - 1) return pick(['🎊 开门红', '🌟 梦幻开局', '✨ 首战告捷']);
    if (idx > 0 && allRecords[idx - 1] && allRecords[idx - 1].result === 'lose') {
      return pick(['💪 强势反弹', '🔄 触底反弹', '🎯 精准反击', '⚔️ 绝地反击']);
    }
    return pick(['✨ 稳扎稳打', '🎉 干净利落', '👍 稳稳的幸福', '🌸 轻松拿下', '😎 常规操作', '💫 顺风顺水']);
  } else {
    if (record.amount >= 800) return pick(['💔 大出血', '😭 惨烈', '🌋 血亏', '📉 爆仓']);
    if (record.amount >= 400) return pick(['😤 有点疼', '💸 肉疼局', '😣 小重伤']);
    if (totalStreak >= 5) return pick(['🥺 ' + totalStreak + '连败深渊', '🌧️ 至暗时刻', '📉 历史低谷']);
    if (totalStreak >= 3) return pick(['😢 ' + totalStreak + '连败', '🌧️ 阴雨绵绵', '🔻 低潮期']);
    if (idx === total - 1) return pick(['🌱 第一课', '📝 交学费', '🎬 序幕']);
    if (idx > 0 && allRecords[idx - 1] && allRecords[idx - 1].result === 'win') {
      return pick(['☁️ 小插曲', '⏸️ 暂停一下', '🍃 歇口气']);
    }
    return pick(['🍀 攒运气中', '🔄 下局翻盘', '💤 运气打盹', '🌈 风雨过后', '🎲 概率问题', '☕ 淡定面对']);
  }
}

// ==================== SUMMARIES ====================
function filterByPeriod(records, startDate, endDate) {
  return records.filter(r => {
    const d = new Date(r.date + 'T00:00:00');
    return d >= startDate && d <= endDate;
  });
}

function getWeekRange() {
  const now = new Date();
  const day = now.getDay();
  // Monday = 1, Sunday = 7 (0 in JS). We'll use Monday as start
  const diffToMonday = day === 0 ? 6 : day - 1;
  const monday = new Date(now);
  monday.setDate(now.getDate() - diffToMonday);
  monday.setHours(0, 0, 0, 0);
  const sunday = new Date(monday);
  sunday.setDate(monday.getDate() + 6);
  sunday.setHours(23, 59, 59, 999);
  return { start: monday, end: sunday, label: '本周' };
}

function getMonthRange() {
  const now = new Date();
  const start = new Date(now.getFullYear(), now.getMonth(), 1);
  const end = new Date(now.getFullYear(), now.getMonth() + 1, 0, 23, 59, 59, 999);
  return { start, end, label: '本月' };
}

function buildSummaryHTML(label, records, periodStart, periodEnd) {

    return `<div class="empty"><div class="big-emoji">📭</div>${label}还没有记录呢～</div>`;
  }

  const wins = records.filter(r => r.result === 'win');
  const losses = records.filter(r => r.result === 'lose');
  const total = records.length;
  const winRate = total > 0 ? ((wins.length / total) * 100).toFixed(0) : 0;
  const net = records.reduce((s, r) => s + (r.result === 'win' ? r.amount : -r.amount), 0);
  const maxWin = wins.length > 0 ? Math.max(...wins.map(r => r.amount)) : 0;
  const maxLose = losses.length > 0 ? Math.max(...losses.map(r => r.amount)) : 0;

  const dateStr = periodStart.toLocaleDateString('zh-CN', { month: 'short', day: 'numeric' })
    + ' — ' + periodEnd.toLocaleDateString('zh-CN', { month: 'short', day: 'numeric' });

  // Emotion
  let mood, emoji, emotionText;
  if (total === 0) {
    mood = 'mixed'; emoji = '🀄'; emotionText = '';

    ]);
  } else if (net >= 0) {
    mood = 'mixed';
    emoji = pick(['🤔', '⚖️', '🎭']);
    emotionText = pick([
      `${label}虽然胜率不太好看，但总账居然是平的（甚至还有赚）！这说明什么？说明你赢的时候赢大的，输的时候输小的——这其实是非常聪明的"资金管理"策略。不是运气型选手，是智慧型 😌`,
      `${label}数据有点意思：胜率不高但没亏。这是典型的"赢大输小"打法，表面上看胜场不多，实际算账一点都不虚。继续保持这种风险控制意识 🧠`,
    ]);
  } else {
    mood = 'negative';
    emoji = pick(['🤗', '💕', '🍀', '🌧️']);
    emotionText = pick([
      `${label}运气确实没怎么站在你这边。但是！一周/一个月的小样本说明不了任何问题。你之前赢过的漂亮局数加起来绝对碾压这周的亏损。运气是流动的，下一周/下个月就会好起来 🌈`,

  const emotionHTML = emotionText ? `
    <div class="summary-emotion ${mood}">
      <div class="se-emoji">${emoji}</div>

    </div>` : '';

  return statsHTML + emotionHTML;
}

function renderSummaries() {
  const records = getRecords();
  const weekRange = getWeekRange();
  const monthRange = getMonthRange();

  const weekRecords = filterByPeriod(records, weekRange.start, weekRange.end);
  const monthRecords = filterByPeriod(records, monthRange.start, monthRange.end);

  document.getElementById('trendChart').innerHTML = buildTrendChart(records);
  document.getElementById('weekContent').innerHTML = buildSummaryHTML('本周', weekRecords, weekRange.start, weekRange.end);
  document.getElementById('monthContent').innerHTML = buildSummaryHTML('本月', monthRecords, monthRange.start, monthRange.end);
}

// ==================== TREND CHART ====================
function buildTrendChart(records) {
  if (records.length === 0) {
    return '<div class="empty"><div class="big-emoji">📊</div>还没有数据可以画图呢</div>';
  }

  const recent = records.slice(0, Math.min(20, records.length)).reverse(); // chronological, max 20

  // Find max amount for scaling
  const maxAmount = Math.max(...recent.map(r => r.amount), 1);
  const maxHeight = 90; // max bar height in px
  const minHeight = 8;

  const bars = recent.map(r => {
    const h = Math.max(minHeight, Math.round((r.amount / maxAmount) * maxHeight));
    const cls = r.result === 'win' ? 'win-bar' : 'lose-bar';
    const label = `${r.result === 'win' ? '+' : '-'}${r.amount}`;
    return `<div class="bar ${cls}" style="height:${h}px;" title="${r.date}: ${label}"></div>`;
  }).join('');

  const labels = recent.map(r => {
    const d = new Date(r.date + 'T00:00:00');
    return `<span>${d.getMonth()+1}/${d.getDate()}</span>`;
  }).join('');

  // Net total line
  let runningNet = 0;
  const netPoints = recent.map(r => {
    runningNet += r.result === 'win' ? r.amount : -r.amount;
    return runningNet;
  });
  const netMin = Math.min(...netPoints, 0);
  const netMax = Math.max(...netPoints, 1);
  const netRange = netMax - netMin || 1;

  const netSummary = runningNet;
  const netColor = netSummary >= 0 ? 'var(--win)' : 'var(--lose)';
  const netSign = netSummary >= 0 ? '+' : '';
  const trend = netPoints.length >= 2 && netPoints[netPoints.length - 1] > netPoints[0] ? '📈 上升' : '📉 下降';

  return `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
      <span style="font-size:0.8em;color:var(--text-light);">最近${recent.length}局走势</span>
      <span style="font-size:0.8em;font-weight:700;color:${netColor};">累计 ${netSign}${netSummary} · ${trend}</span>
    </div>
    <div class="chart-container">
      <div class="bar-chart">${bars}</div>
      <div class="chart-labels">${labels}</div>
    </div>
    <div style="display:flex;gap:16px;font-size:0.72em;color:var(--text-light);margin-top:4px;">
      <span>🟥 赢</span><span>⬜ 输</span><span>柱高=盈亏金额</span>
    </div>`;
}

// ==================== REMINDERS ====================
function addReminder() {
  const date = document.getElementById('remDate').value;
  const time = document.getElementById('remTime').value;
  const note = document.getElementById('remNote').value.trim();

  if (!date || !time) { toast('请填写日期和时间'); return; }

  const reminders = getReminders();
  reminders.push({
    id: Date.now(),
    datetime: date + 'T' + time,
    note,
    notified: false
  });
  reminders.sort((a, b) => a.datetime.localeCompare(b.datetime));
  saveReminders(reminders);

  document.getElementById('remNote').value = '';
  toast('✅ 提醒已添加');
  renderReminders();
}

function deleteReminder(id) {
  let reminders = getReminders();
  reminders = reminders.filter(r => r.id !== id);
  saveReminders(reminders);
  renderReminders();
}

function renderReminders() {
  const reminders = getReminders();
  const container = document.getElementById('reminders');
  if (reminders.length === 0) {
    container.innerHTML = '<div class="empty"><div class="big-emoji">📅</div>暂无提醒</div>';
    return;
  }
  container.innerHTML = reminders.map(r => {
    const dt = new Date(r.datetime);
    const now = new Date();
    const isPast = dt < now;
    const badgeClass = isPast ? 'badge-past' : 'badge-upcoming';
    const badgeText = isPast ? '已过期' : '待开局';
    const dateStr = dt.toLocaleDateString('zh-CN', { month: 'short', day: 'numeric', weekday: 'short' });
    const timeStr = dt.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });

    return `
      <div class="reminder-item">
        <div>
          <div class="r-time">${dateStr} ${timeStr}</div>
          ${r.note ? `<div class="r-detail">📍 ${r.note}</div>` : ''}
        </div>
        <div style="display:flex;align-items:center;gap:10px;">
          <span class="r-badge ${badgeClass}">${badgeText}</span>
          <button class="btn btn-ghost btn-sm" onclick="deleteReminder(${r.id})">✕</button>
        </div>
      </div>`;
  }).join('');
}

// ==================== INIT ====================
(function init() {
  document.getElementById('recDate').value = new Date().toISOString().split('T')[0];
  document.getElementById('remDate').value = new Date().toISOString().split('T')[0];
  updateEmotionBanner();
  updateQuickStats();
  renderReminders();

  if (Notification && Notification.permission === 'default') {
    Notification.requestPermission();
  }
  checkReminders();
  setInterval(checkReminders, 60000);
})();

function checkReminders() {
  const reminders = getReminders();
  const now = new Date();
  let changed = false;
  reminders.forEach(r => {
    const dt = new Date(r.datetime);
    const diff = dt - now;
    if (!r.notified && diff > 0 && diff < 30 * 60 * 1000) {
      if (Notification && Notification.permission === 'granted') {
        new Notification('🀄 麻将时间快到了！', {
          body: `约局提醒：${dt.toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'})} ${r.note || ''}`,
        });
      }
      r.notified = true;
      changed = true;
    }
  });
  if (changed) {
    saveReminders(reminders);
    if (document.getElementById('sec-reminder').classList.contains('active')) renderReminders();
  }
}
</script>
